<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Not found — racing-shooter</title>
<!--
  GITHUB PAGES IS CASE-SENSITIVE, AND THE OWNER TYPED /v2/.

  The build lives at /V2/ because that is the folder that was asked for, and
  /v2/ returned a hard 404 — a dead link for a one-letter difference, on the one
  URL that is meant to be opened on a phone where nobody enjoys typing.

  WHY THIS FILE AND NOT A LOWERCASE COPY OF THE FOLDER. `V2/` and `v2/` in one
  repository are the same path on a case-insensitive filesystem, which is what
  macOS and Windows check out by default. Two such folders make a clone either
  collide or silently keep one of them, and a build output that exists twice
  goes stale the first time only one is rebuilt. So there is exactly one folder,
  and this page repairs the case on the way in.

  Pages serves /404.html for any path it cannot find, so this runs INSTEAD of a
  dead end and costs nothing on a URL that resolves. The redirect is a `replace`
  so a mistyped link does not sit in the back button between you and the game.
-->
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    font: 15px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace;
    background: #14171c; color: #cfd6dd; padding: 24px; text-align: center;
  }
  a { color: #7cc4ff; }
  .big { font-size: 20px; color: #fff; margin-bottom: 4px; }
  .row { margin: 14px 0 0; }
</style>
</head>
<body>
<div>
  <p class="big" id="head">404 — not found</p>
  <p id="note">That path is not on this site.</p>
  <p class="row"><a href="/racing-shooter/V2/">DUSTLINE (V2)</a> · <a href="/racing-shooter/V2/editor.html">track editor</a> · <a href="/racing-shooter/">IGNITE RALLY</a></p>
</div>
<script>
  (function () {
    var path = location.pathname;
    // Repair the case of the V2 segment wherever it sits in the path, keeping
    // everything after it — so /v2/editor.html and /V2/?track=harbour both land
    // where they were meant to, query string and hash included.
    var fixed = path.replace(/(^|\/)v2(\/|$)/i, '$1V2$2');
    if (fixed !== path) {
      location.replace(fixed + location.search + location.hash);
      return;
    }
    // Not a case problem: say what was actually asked for rather than leaving a
    // bare 404, because "it's 404" with no path in it is hard to act on.
    document.getElementById('note').textContent = path + ' is not on this site.';
  })();
</script>
</body>
</html>
